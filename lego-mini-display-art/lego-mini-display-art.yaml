esphome:
  name: lego-display-1
  friendly_name: lego-display-1
  on_boot:
    priority: -100
    then:
      - delay: 5s
      - script.execute: charger_liste

esp32:
  board: esp32dev
  framework:
    type: arduino

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23

substitutions:
  serveur: "http://192.168.1.10:8080"

globals:
  - id: poster_index
    type: int
    initial_value: '-1'
  - id: poster_liste
    type: std::vector<std::string>

http_request:
  id: http_req
  timeout: 10s
  verify_ssl: false
  buffer_size_rx: 1024

online_image:
  - id: panneau
    url: ${serveur}/blade_runner.png
    format: PNG
    type: RGB565
    update_interval: never
    on_download_finished:
      - component.update: ecran
    on_error:
      - logger.log: "Echec telechargement du poster"
  
display:
  - platform: st7735
    id: ecran
    model: INITR_BLACKTAB
    cs_pin: GPIO27
    dc_pin: GPIO21
    reset_pin: GPIO22
    rotation: 0°
    device_width: 128
    device_height: 160
    col_start: 0
    row_start: 0
    lambda: |-
      it.fill(Color::BLACK);
      it.image(16, 16, id(panneau));

script:
  - id: charger_liste
    mode: single
    then:
      - http_request.get:
          url: ${serveur}/liste.txt
          capture_response: true
          max_response_buffer_size: 2048
          on_response:
            then:
              - lambda: |-
                  if (response->status_code != 200) {
                    ESP_LOGW("liste", "Echec liste : HTTP %d", response->status_code);
                    return;
                  }
                  std::vector<std::string> nouvelle;
                  std::string ligne;
                  for (char c : body) {
                    if (c == '\n' || c == '\r') {
                      if (!ligne.empty()) nouvelle.push_back(ligne);
                      ligne.clear();
                    } else {
                      ligne += c;
                    }
                  }
                  if (!ligne.empty()) nouvelle.push_back(ligne);

                  if (!nouvelle.empty()) {
                    id(poster_liste) = nouvelle;
                    ESP_LOGI("liste", "%d posters charges", (int) nouvelle.size());
                  }
              - script.execute: poster_suivant

  # Passe au poster suivant
  - id: poster_suivant
    mode: restart
    then:
      - lambda: |-
          if (id(poster_liste).empty()) {
            ESP_LOGW("liste", "Liste vide");
            return;
          }
          id(poster_index) = (id(poster_index) + 1) % id(poster_liste).size();
          std::string url = std::string("${serveur}/") + id(poster_liste)[id(poster_index)];
          ESP_LOGI("liste", "Poster %d : %s", id(poster_index), url.c_str());
          id(panneau)->release();
          id(panneau)->set_url(url.c_str());
          id(panneau)->update();


interval:
  # Rafraîchir la liste toutes les 10 minutes
  - interval: 10min
    then:
      - script.execute: charger_liste
  # Changer de poster toutes les 30 secondes
  - interval: 30s
    then:
      - script.execute: poster_suivant
    
output:
  - platform: ledc
    pin: GPIO25
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Backlight"
    id: backlight
    restore_mode: ALWAYS_ON

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: lego-display-1 Fallback Hotspot
    password: uauHLvUtIkUv

ota:
  - platform: esphome
    encryption:

api:
  encryption:
    key: !secret lego_display_1__encryption_key

logger:
